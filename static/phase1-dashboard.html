<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TriMatch Pro AI — Phase 1 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090d;
    --panel: rgba(16, 22, 36, 0.8);
    --panel-2: rgba(22, 30, 50, 0.9);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --muted-2: #64748b;
    --line: rgba(99, 179, 237, 0.1);
    --accent: #63b3ed;
    --accent-2: #7c3aed;
    --accent-dim: rgba(99, 179, 237, 0.14);
    --pass: #34d399;
    --pass-dim: rgba(52, 211, 153, 0.14);
    --fail: #fc8181;
    --fail-dim: rgba(252, 129, 129, 0.14);
    --unknown: #f6ad55;
    --unknown-dim: rgba(246, 173, 85, 0.14);
    --radius: 10px;
    --font-ui: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    --ease: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background-color: var(--bg);
    background-image:
      radial-gradient(680px circle at 95% -8%, rgba(99, 179, 237, 0.12), transparent 70%),
      radial-gradient(520px circle at 0% 40%, rgba(124, 58, 237, 0.08), transparent 70%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text);
    padding: 2rem 1.5rem 4rem;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .back-link {
    display: inline-block;
    max-width: 900px;
    margin: 0 auto 1rem;
    color: var(--muted-2);
    text-decoration: none;
    font-size: 12.5px;
    transition: color var(--ease);
  }
  .back-link-wrap { display: flex; justify-content: center; }
  .back-link:hover { color: var(--muted); }
  header {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    animation: fadeInUp 450ms ease-out;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 1.25rem;
  }
  .search-row {
    display: flex;
    gap: 0.5rem;
    max-width: 900px;
    margin: 0 auto 1rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    transition: border-color var(--ease), box-shadow var(--ease);
  }
  input[type="text"]:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); outline: none; }
  button {
    padding: 0.6rem 1.1rem;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity var(--ease), transform var(--ease);
  }
  button:hover { opacity: 0.88; transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; }
  main { max-width: 900px; margin: 0 auto; }
  .status { color: var(--muted); font-size: 0.9rem; margin: 1rem 0; }
  .error {
    background: var(--fail-dim);
    border: 1px solid rgba(252, 129, 129, 0.35);
    color: var(--fail);
    padding: 0.75rem 1rem;
    border-radius: var(--radius);
    margin: 1rem 0;
  }
  .trial-header {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
  }
  .trial-header h2 { margin: 0 0 0.35rem; font-size: 1.1rem; font-weight: 600; }
  .trial-meta { color: var(--muted); font-family: var(--font-mono); font-size: 0.85rem; }
  .candidate {
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    overflow: hidden;
    transition: border-color var(--ease);
    animation: fadeInUp 350ms ease-out both;
  }
  .candidate-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1.1rem;
    cursor: pointer;
    gap: 1rem;
    transition: background var(--ease);
  }
  .candidate-summary:hover { background: rgba(99, 179, 237, 0.06); }
  .candidate-left { display: flex; align-items: center; gap: 0.75rem; }
  .patient-id { font-weight: 600; font-family: var(--font-mono); }
  .counts { color: var(--muted); font-size: 0.85rem; }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge-eligible { background: var(--pass-dim); color: var(--pass); }
  .badge-ineligible { background: var(--fail-dim); color: var(--fail); }
  .badge-needs_more_data { background: var(--unknown-dim); color: var(--unknown); }
  .verdict-pass { color: var(--pass); }
  .verdict-fail { color: var(--fail); }
  .verdict-unknown { color: var(--muted-2); }
  .chevron { color: var(--muted); transition: transform var(--ease); }
  .candidate.open .chevron { transform: rotate(90deg); }
  .criteria-table {
    display: none;
    border-top: 1px solid var(--line);
  }
  .candidate.open .criteria-table { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td {
    text-align: left;
    padding: 0.5rem 1.1rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th { color: var(--muted-2); font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .crit-type { color: var(--muted-2); font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; }
  .crit-text { color: var(--muted); max-width: 260px; }
</style>
</head>
<body>

<div class="back-link-wrap"><a class="back-link" href="index.html">&larr; Back to TriMatch home</a></div>

<header>
  <h1>TriMatch Pro AI</h1>
  <p class="subtitle">Clinical trial matching &mdash; ranked candidates with a per-criterion explanation for every decision.</p>
  <div class="search-row">
    <input type="text" id="nctId" placeholder="Enter an NCT ID, e.g. NCT04280705" />
    <button id="loadBtn">Load candidates</button>
  </div>
  <div id="status" class="status"></div>
</header>

<main id="results"></main>

<script>
  const nctInput = document.getElementById('nctId');
  const loadBtn = document.getElementById('loadBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  function badgeClass(overall) {
    return 'badge-' + overall.replace(/ /g, '_');
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderCandidates(trial) {
    const header = `
      <div class="trial-header">
        <h2>${escapeHtml(trial.title || trial.nct_id)}</h2>
        <div class="trial-meta">${escapeHtml(trial.nct_id)} &middot; ${trial.criteria.length} criteria parsed &middot; ${trial.candidates.length} patients screened</div>
      </div>
    `;

    const cards = trial.candidates.map((c, idx) => {
      const rows = c.results.map(r => `
        <tr>
          <td>${escapeHtml(r.id)}<div class="crit-type">${escapeHtml(r.type)}</div></td>
          <td class="crit-text">${escapeHtml(r.text)}</td>
          <td class="verdict-${escapeHtml(r.verdict)}">${escapeHtml(r.verdict)}</td>
          <td>${escapeHtml(Array.isArray(r.patient_value) ? r.patient_value.join(', ') : r.patient_value)}</td>
          <td class="crit-text">${escapeHtml(r.reason)}</td>
        </tr>
      `).join('');

      return `
        <div class="candidate" id="candidate-${idx}" style="animation-delay: ${Math.min(idx * 40, 400)}ms">
          <div class="candidate-summary" onclick="document.getElementById('candidate-${idx}').classList.toggle('open')">
            <div class="candidate-left">
              <span class="chevron">&#9656;</span>
              <span class="patient-id">${escapeHtml(c.patient_id)}</span>
              <span class="badge ${badgeClass(c.overall)}">${escapeHtml(c.overall)}</span>
            </div>
            <div class="counts">${c.pass_count} pass &middot; ${c.fail_count} fail &middot; ${c.unknown_count} unknown</div>
          </div>
          <div class="criteria-table">
            <table>
              <thead>
                <tr><th>ID</th><th>Criterion</th><th>Verdict</th><th>Patient value</th><th>Reason</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }).join('');

    resultsEl.innerHTML = header + cards;
  }

  async function loadCandidates() {
    const nctId = nctInput.value.trim();
    if (!nctId) return;

    loadBtn.disabled = true;
    resultsEl.innerHTML = '';
    statusEl.textContent = 'Fetching trial and parsing eligibility criteria with an LLM — this can take up to 30 seconds…';
    statusEl.className = 'status';

    try {
      const res = await fetch(`/trials/${encodeURIComponent(nctId)}/candidates`);
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = '';
        resultsEl.innerHTML = `<div class="error">${escapeHtml(data.detail || 'Request failed')}</div>`;
        return;
      }
      statusEl.textContent = '';
      renderCandidates(data);
    } catch (err) {
      statusEl.textContent = '';
      resultsEl.innerHTML = `<div class="error">Request failed: ${escapeHtml(err.message)}</div>`;
    } finally {
      loadBtn.disabled = false;
    }
  }

  loadBtn.addEventListener('click', loadCandidates);
  nctInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadCandidates();
  });
</script>

</body>
</html>

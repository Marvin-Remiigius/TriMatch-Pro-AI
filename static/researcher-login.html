<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TriMatch Pro AI — Researcher Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090d;
    --panel: rgba(16, 22, 36, 0.75);
    --panel-2: rgba(22, 30, 50, 0.9);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --muted-2: #64748b;
    --line: rgba(99, 179, 237, 0.12);
    --accent: #63b3ed;
    --accent-dim: rgba(99, 179, 237, 0.14);
    --radius: 10px;
    --radius-lg: 18px;
    --font-ui: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    --ease: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(560px circle at 15% 15%, rgba(99, 179, 237, 0.16), transparent 70%),
      radial-gradient(420px circle at 90% 20%, rgba(124, 58, 237, 0.1), transparent 70%),
      radial-gradient(540px circle at 75% 90%, rgba(99, 179, 237, 0.08), transparent 70%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 2.25rem 2.25rem 2rem;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    animation: fadeInUp 500ms ease-out;
  }

  .back-link {
    display: inline-block;
    color: var(--muted-2);
    text-decoration: none;
    font-size: 12.5px;
    margin-bottom: 1.75rem;
    transition: color var(--ease);
  }
  .back-link:hover { color: var(--muted); }

  .badge-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem; }

  .portal-icon {
    width: 30px;
    height: 30px;
    border-radius: var(--radius);
    background: var(--accent-dim);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    box-shadow: 0 0 14px rgba(91, 141, 184, 0.4);
  }

  .portal-icon .icon { width: 16px; height: 16px; }

  .icon {
    width: 1em;
    height: 1em;
    flex-shrink: 0;
    vertical-align: -0.15em;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  h1 { font-size: 18px; font-weight: 600; margin: 0; }

  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0.4rem 0 2rem;
  }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 0.4rem;
  }

  .field { margin-bottom: 1.1rem; }

  input[type="text"] {
    width: 100%;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.7rem 0.85rem;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
  }

  input[type="text"]::placeholder { color: var(--muted-2); }
  input[type="text"]:focus-visible {
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 3px var(--accent-dim);
    outline: none;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(99, 179, 237, 0.3);
    border-radius: var(--radius);
    padding: 0.8rem 1rem;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: background var(--ease), box-shadow var(--ease), transform var(--ease);
  }
  .btn-primary:hover { background: rgba(99, 179, 237, 0.24); box-shadow: 0 6px 22px rgba(99, 179, 237, 0.25); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .footnote {
    color: var(--muted-2);
    font-size: 11px;
    margin-top: 1.75rem;
    text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <a class="back-link" href="index.html">&larr; Back to TriMatch home</a>

  <div class="badge-row">
    <div class="portal-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h1>Researcher sign in</h1>
  </div>
  <p class="sub">Enter your name to continue to the research dashboard.</p>

  <form id="loginForm">
    <div class="field">
      <label for="nameInput">Name</label>
      <input type="text" id="nameInput" placeholder="e.g. Dr. Priya Anand" autocomplete="name" required />
    </div>
    <div class="field">
      <label for="orgInput">Organization <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
      <input type="text" id="orgInput" placeholder="e.g. Northview Research Institute" autocomplete="organization" />
    </div>
    <button type="submit" class="btn-primary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>Continue to dashboard</button>
  </form>

  <div class="footnote">Demo sign-in — any name is accepted, nothing is stored beyond this browser session.</div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim() || 'Researcher';
    const org = document.getElementById('orgInput').value.trim();
    sessionStorage.setItem('tm_researcher_name', name);
    sessionStorage.setItem('tm_researcher_org', org);
    window.location.href = 'researcher.html';
  });
</script>

</body>
</html>

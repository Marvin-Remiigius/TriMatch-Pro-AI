<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TriMatch Pro AI — Researcher</title>
<style>
  :root {
    --bg: #0C0D0F;
    --panel: #141619;
    --panel-2: #1A1D21;
    --text: #E6E7E9;
    --muted: #8A8F98;
    --muted-2: #5D6169;
    --line: #22252A;
    --accent: #5B8DB8;
    --accent-dim: rgba(91, 141, 184, 0.14);
    --pass: #7BA786;
    --pass-dim: rgba(123, 167, 134, 0.14);
    --fail: #C06A5F;
    --fail-dim: rgba(192, 106, 95, 0.14);
    --unknown: #BCA274;
    --unknown-dim: rgba(188, 162, 116, 0.14);
    --radius: 3px;
    --font-ui: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
    --ease: 140ms ease;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  button, input {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  .mono { font-family: var(--font-mono); }

  /* ---------- Session bar (shared shell) ---------- */

  .session-bar {
    border-bottom: 1px solid var(--line);
    padding: 0.6rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .session-left { display: flex; align-items: center; gap: 0.6rem; }

  .role-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: var(--radius);
  }
  .role-badge.role-researcher { background: var(--accent-dim); color: var(--accent); }

  .session-name { color: var(--muted); font-size: 13px; }

  .signout-btn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.4rem 0.8rem;
    color: var(--muted);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
  }
  .signout-btn:hover { border-color: var(--muted-2); color: var(--text); }

  /* ---------- Header ---------- */

  header {
    border-bottom: 1px solid var(--line);
    padding: 1.1rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem 1.5rem;
  }

  .brand {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .brand .dim { color: var(--muted); font-weight: 400; }

  .load-row {
    display: flex;
    gap: 0.5rem;
    flex: 1 1 320px;
    max-width: 560px;
  }

  #nctInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.5rem 0.7rem;
    color: var(--text);
  }

  #nctInput::placeholder { color: var(--muted-2); }

  #nctInput:focus-visible { border-color: var(--accent); }

  #patientCountInput {
    width: 5.5rem;
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.5rem 0.6rem;
    color: var(--text);
    font-family: var(--font-mono);
  }

  #patientCountInput::placeholder { color: var(--muted-2); }

  #patientCountInput:focus-visible { border-color: var(--accent); }

  #loadBtn {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.5rem 0.95rem;
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
    color: var(--text);
  }

  #loadBtn:hover { border-color: var(--muted); }
  #loadBtn:disabled { color: var(--muted-2); cursor: default; }

  .trial-info {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    flex-wrap: wrap;
    min-width: 0;
  }

  .trial-info .title {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 32ch;
  }

  .trial-info .meta {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: nowrap;
  }

  .status-line {
    padding: 0 1.5rem;
    min-height: 0;
  }

  .status-msg {
    color: var(--muted);
    font-size: 12.5px;
    padding: 0.6rem 0;
  }

  .error-msg {
    color: var(--fail);
    font-size: 12.5px;
    padding: 0.6rem 0;
    border-top: 1px solid var(--line);
  }

  /* ---------- Workspace ---------- */

  .workspace {
    display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr;
    min-height: calc(100vh - 60px);
  }

  @media (max-width: 880px) {
    .workspace {
      grid-template-columns: 1fr;
    }
  }

  .panel {
    padding: 1.25rem 1.5rem;
  }

  .candidates-panel {
    border-right: 1px solid var(--line);
  }

  @media (max-width: 880px) {
    .candidates-panel {
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
  }

  /* ---------- Funnel stat ---------- */

  .funnel {
    margin-bottom: 1.25rem;
  }

  .funnel-figure {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .funnel-figure .of {
    color: var(--muted);
    font-size: 18px;
    font-weight: 400;
  }

  .funnel-label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 0.15rem;
  }

  .funnel-sub {
    color: var(--muted-2);
    font-size: 11.5px;
    margin-top: 0.35rem;
    font-family: var(--font-mono);
  }

  /* ---------- Candidate list ---------- */

  .candidate-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .candidate {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.65rem 0.8rem;
    cursor: pointer;
    transition: border-color var(--ease), background var(--ease);
  }

  .candidate:hover { border-color: var(--muted-2); }

  .candidate.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .candidate-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .candidate-id {
    font-family: var(--font-mono);
    font-size: 12.5px;
  }

  .candidate-demo {
    color: var(--muted);
    font-size: 11.5px;
    margin-top: 0.15rem;
    font-family: var(--font-mono);
  }

  .candidate-tally {
    color: var(--muted);
    font-size: 11px;
    font-family: var(--font-mono);
    margin-top: 0.35rem;
  }

  .badge {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.15rem 0.45rem;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .badge-eligible { background: var(--pass-dim); color: var(--pass); }
  .badge-ineligible { background: var(--fail-dim); color: var(--fail); }
  .badge-needs_more_data { background: var(--unknown-dim); color: var(--unknown); }

  /* ---------- Detail panel ---------- */

  .detail-empty {
    color: var(--muted);
    font-size: 13px;
    padding-top: 0.25rem;
  }

  .detail-header {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding-bottom: 0.9rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--line);
  }

  .detail-header .id {
    font-family: var(--font-mono);
    font-size: 15px;
  }

  .detail-header .demo {
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12.5px;
  }

  .group-label {
    margin: 1.4rem 0 0.6rem;
  }

  .group-label:first-of-type { margin-top: 0; }

  .criterion {
    border-top: 1px solid var(--line);
    padding: 0.85rem 0;
  }

  .criterion:first-of-type { border-top: none; }

  .criterion-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .criterion-text {
    flex: 1;
    font-size: 13px;
  }

  .verdict-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.18rem 0.5rem;
    border-radius: var(--radius);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .verdict-pass { background: var(--pass-dim); color: var(--pass); }
  .verdict-fail { background: var(--fail-dim); color: var(--fail); }
  .verdict-unknown { background: var(--unknown-dim); color: var(--unknown); }

  .criterion-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-top: 0.5rem;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .criterion-meta .kv-label {
    color: var(--muted-2);
  }

  .criterion-meta .kv-value {
    color: var(--muted);
  }

  .criterion-reason {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 0.4rem;
  }

  .verify-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .verify-btn:hover { color: var(--text); }
  .verify-btn:disabled { color: var(--muted-2); cursor: default; text-decoration: none; }

  .verify-panel {
    margin-top: 0.6rem;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.75rem 0.9rem;
    font-size: 12px;
  }

  .verify-panel .verify-row {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.2rem 0;
    font-family: var(--font-mono);
  }

  .verify-panel .verify-row .k { color: var(--muted-2); }
  .verify-panel .verify-row .v { color: var(--text); text-align: right; }
  .verify-panel .verify-row .v.abnormal { color: var(--fail); }

  .verify-status {
    margin-top: 0.5rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .verify-status.ok { color: var(--pass); }
  .verify-status.mismatch { color: var(--fail); }

  .rule-breakdown {
    margin-top: 0.6rem;
    padding-left: 0.85rem;
    border-left: 2px solid var(--line);
  }

  .rule-row {
    padding: 0.45rem 0;
    border-top: 1px solid var(--line);
    font-size: 12px;
  }

  .rule-row:first-child { border-top: none; }

  .rule-row .rule-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .rule-row .rule-group-label {
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10px;
    margin-right: 0.5rem;
  }

  .skeleton {
    color: var(--muted-2);
    font-size: 12.5px;
  }

  /* ---------- Tabs ---------- */

  .tab-row {
    display: none;
    gap: 1.25rem;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--line);
  }

  .tab-row.visible { display: flex; }

  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    padding: 0.65rem 0.1rem;
    cursor: pointer;
    font-size: 13px;
    transition: color var(--ease), border-color var(--ease);
  }

  .tab-btn:hover { color: var(--text); }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Progress view ---------- */

  .metrics-row {
    display: flex;
    gap: 2.25rem;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }

  .metric {
    min-width: 90px;
  }

  .metric-figure {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 500;
    line-height: 1.1;
  }

  .metric-figure.headline {
    font-size: 30px;
    color: var(--accent);
  }

  .metric-label {
    color: var(--muted);
    font-size: 12px;
    margin-top: 0.15rem;
  }

  .metric-sub {
    color: var(--muted-2);
    font-size: 11px;
    margin-top: 0.2rem;
    font-family: var(--font-mono);
    max-width: 34ch;
  }

  .disclaimer {
    color: var(--muted-2);
    font-size: 11.5px;
    line-height: 1.5;
    max-width: 60ch;
    padding: 0.75rem 0 1.25rem;
    border-bottom: 1px solid var(--line);
    margin-bottom: 1.1rem;
  }

  .patient-progress-row {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.65rem 0.8rem;
    cursor: pointer;
    margin-bottom: 0.4rem;
    transition: border-color var(--ease), background var(--ease);
  }

  .patient-progress-row:hover { border-color: var(--muted-2); }

  .patient-progress-row.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .ppr-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .ppr-id {
    font-family: var(--font-mono);
    font-size: 12.5px;
  }

  .status-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  .ppr-tests {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    margin-top: 0.5rem;
  }

  .test-readout {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }

  .dev-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dev-improved { background: var(--pass); }
  .dev-worsened { background: var(--fail); }
  .dev-indeterminate { background: var(--muted); }
  .dev-no_data { background: var(--muted-2); }

  .readout-value { color: var(--muted); }

  .test-detail {
    border-top: 1px solid var(--line);
    padding: 0.9rem 0;
  }

  .test-detail:first-of-type { border-top: none; }

  .test-detail-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .test-name {
    font-size: 13px;
    font-weight: 600;
  }

  .dev-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.18rem 0.5rem;
    border-radius: var(--radius);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .dev-pill.dev-improved { background: var(--pass-dim); color: var(--pass); }
  .dev-pill.dev-worsened { background: var(--fail-dim); color: var(--fail); }
  .dev-pill.dev-indeterminate { background: rgba(138, 143, 152, 0.14); color: var(--muted); }
  .dev-pill.dev-no_data { background: rgba(93, 97, 105, 0.12); color: var(--muted-2); }

  .test-readout-line {
    font-family: var(--font-mono);
    font-size: 13px;
    margin-top: 0.4rem;
  }

  .test-citations {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1rem;
    margin-top: 0.4rem;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted-2);
  }

  /* ---------- Progress charts ---------- */

  .metrics-top {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .progress-ring {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .progress-ring-hole {
    position: absolute;
    inset: 9px;
    background: var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .progress-ring-pct {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }

  .metrics-side {
    display: flex;
    gap: 1.75rem;
  }

  .cohort-chart {
    margin-top: 0.4rem;
  }

  .cohort-title {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 0.9rem;
  }

  .cohort-row {
    margin-bottom: 0.9rem;
  }

  .cohort-row-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 12px;
    margin-bottom: 0.3rem;
  }

  .cohort-row-label .name { color: var(--text); }
  .cohort-row-label .counts { color: var(--muted-2); font-size: 11px; }

  .cohort-track {
    display: flex;
    height: 8px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--line);
  }

  .cohort-segment { height: 100%; }
  .cohort-segment.seg-improved { background: var(--pass); }
  .cohort-segment.seg-worsened { background: var(--fail); }
  .cohort-segment.seg-indeterminate { background: var(--unknown); }
  .cohort-segment.seg-no_data { background: var(--muted-2); opacity: 0.5; }

  .cohort-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem 1rem;
    margin-top: 1.1rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }

  .cohort-legend .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 0.35rem;
  }

  .change-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.15rem;
  }

  .change-bar-track {
    width: 56px;
    height: 5px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
    flex-shrink: 0;
  }

  .change-bar-fill { height: 100%; border-radius: 3px; }
  .change-bar-fill.dev-improved { background: var(--pass); }
  .change-bar-fill.dev-worsened { background: var(--fail); }
  .change-bar-fill.dev-indeterminate { background: var(--unknown); }
  .change-bar-fill.dev-no_data { background: var(--muted-2); }

  /* ---------- Enrollment view ---------- */

  .enrollment-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 0.65rem 0.8rem;
    margin-bottom: 0.4rem;
  }

  .er-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .er-id { font-family: var(--font-mono); font-size: 12.5px; }

  .status-pill {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: var(--radius);
    white-space: nowrap;
  }

  .status-pill.st-not_invited { background: rgba(93, 97, 105, 0.12); color: var(--muted-2); }
  .status-pill.st-invited { background: var(--unknown-dim); color: var(--unknown); }
  .status-pill.st-accepted { background: var(--unknown-dim); color: var(--unknown); }
  .status-pill.st-consented { background: var(--accent-dim); color: var(--accent); }
  .status-pill.st-enrolled { background: var(--pass-dim); color: var(--pass); }
  .status-pill.st-declined { background: rgba(93, 97, 105, 0.12); color: var(--muted-2); }
  .status-pill.st-withdrawn { background: var(--fail-dim); color: var(--fail); }

  .er-actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.5rem;
    flex-wrap: wrap;
  }

  .er-btn {
    font-size: 11.5px;
    padding: 0.3rem 0.6rem;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color var(--ease), color var(--ease);
  }

  .er-btn:hover { border-color: var(--accent); color: var(--accent); }
  .er-btn.danger:hover { border-color: var(--fail); color: var(--fail); }
  .er-btn:disabled { opacity: 0.45; cursor: default; }

  .er-link {
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
  }
  .er-link:hover { text-decoration: underline; }

  .audit-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11.5px;
  }

  .audit-table th {
    text-align: left;
    color: var(--muted-2);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 400;
    padding: 0.4rem 0.6rem;
    border-bottom: 1px solid var(--line);
  }

  .audit-table td {
    padding: 0.45rem 0.6rem;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-mono);
    color: var(--muted);
    vertical-align: top;
  }

  .audit-table td.actor-researcher { color: var(--accent); }
  .audit-table td.actor-patient { color: var(--pass); }
</style>
</head>
<body>

<div class="session-bar">
  <div class="session-left">
    <span class="role-badge role-researcher">Researcher</span>
    <span class="session-name" id="sessionName">Guest researcher</span>
  </div>
  <button class="signout-btn" id="signoutBtn">Sign out</button>
</div>

<header>
  <div class="brand">TriMatch <span class="dim">Researcher</span></div>
  <div class="load-row">
    <input type="text" id="nctInput" placeholder="NCT ID, e.g. NCT04280705" />
    <input type="number" id="patientCountInput" placeholder="Patients" value="30" min="1" max="1000" title="Number of patients to evaluate" />
    <button id="loadBtn">Load trial</button>
  </div>
  <div class="trial-info" id="trialInfo"></div>
</header>

<div class="tab-row" id="tabRow">
  <button class="tab-btn active" id="tabCandidates">Candidates</button>
  <button class="tab-btn" id="tabProgress">Trial progress</button>
  <button class="tab-btn" id="tabEnrollment">Enrollment</button>
</div>

<div class="status-line" id="statusLine"></div>

<div class="view active" id="viewCandidates">
  <main class="workspace">
    <section class="panel candidates-panel">
      <div id="funnelArea"></div>
      <div class="candidate-list" id="candidateList"></div>
    </section>

    <section class="panel detail-panel" id="detailPanel">
      <div class="detail-empty">Select a candidate to see the full breakdown.</div>
    </section>
  </main>
</div>

<div class="view" id="viewProgress">
  <main class="workspace">
    <section class="panel candidates-panel">
      <div id="metricsArea"></div>
      <div class="candidate-list" id="progressList"></div>
    </section>

    <section class="panel detail-panel" id="progressDetailPanel">
      <div class="detail-empty">Select a patient to see their full test breakdown.</div>
    </section>
  </main>
</div>

<div class="view" id="viewEnrollment">
  <main class="workspace">
    <section class="panel candidates-panel">
      <div id="enrollmentSummary"></div>
      <div class="candidate-list" id="enrollmentList"></div>
    </section>

    <section class="panel detail-panel" id="auditPanel">
      <div class="detail-empty">Audit trail for this trial will appear here.</div>
    </section>
  </main>
</div>

<script>
  (function initSession() {
    const name = sessionStorage.getItem('tm_researcher_name');
    const org = sessionStorage.getItem('tm_researcher_org');
    const sessionNameEl = document.getElementById('sessionName');
    if (name) {
      sessionNameEl.textContent = org ? `${name} · ${org}` : name;
    }
    document.getElementById('signoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('tm_researcher_name');
      sessionStorage.removeItem('tm_researcher_org');
      window.location.href = 'index.html';
    });
  })();

  const nctInput = document.getElementById('nctInput');
  const patientCountInput = document.getElementById('patientCountInput');
  const loadBtn = document.getElementById('loadBtn');
  const trialInfo = document.getElementById('trialInfo');
  const statusLine = document.getElementById('statusLine');
  const funnelArea = document.getElementById('funnelArea');
  const candidateList = document.getElementById('candidateList');
  const detailPanel = document.getElementById('detailPanel');
  const tabRow = document.getElementById('tabRow');
  const tabCandidates = document.getElementById('tabCandidates');
  const tabProgress = document.getElementById('tabProgress');
  const tabEnrollment = document.getElementById('tabEnrollment');
  const viewCandidates = document.getElementById('viewCandidates');
  const viewProgress = document.getElementById('viewProgress');
  const viewEnrollment = document.getElementById('viewEnrollment');
  const metricsArea = document.getElementById('metricsArea');
  const progressList = document.getElementById('progressList');
  const progressDetailPanel = document.getElementById('progressDetailPanel');
  const enrollmentSummary = document.getElementById('enrollmentSummary');
  const enrollmentList = document.getElementById('enrollmentList');
  const auditPanel = document.getElementById('auditPanel');

  let currentNctId = null;
  let currentPatientCount = 30;
  let selectedPatientId = null;
  let progressLoadedFor = null;
  let enrollmentLoadedFor = null;
  let cachedCandidates = null;
  let cachedCandidatesFor = null;

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function shortId(id) {
    return id.length > 10 ? id.slice(0, 8) : id;
  }

  function setStatus(message) {
    statusLine.innerHTML = message ? `<div class="status-msg">${esc(message)}</div>` : '';
  }

  function setError(message) {
    statusLine.innerHTML = `<div class="error-msg">${esc(message)}</div>`;
  }

  function badgeClass(overall) {
    return 'badge-' + overall.replace(/ /g, '_');
  }

  async function loadTrial() {
    const nctId = nctInput.value.trim();
    if (!nctId) return;

    const rawCount = parseInt(patientCountInput.value, 10);
    currentPatientCount = Number.isFinite(rawCount) ? Math.min(1000, Math.max(1, rawCount)) : 30;
    patientCountInput.value = currentPatientCount;

    loadBtn.disabled = true;
    trialInfo.innerHTML = '';
    funnelArea.innerHTML = '';
    candidateList.innerHTML = '';
    detailPanel.innerHTML = '<div class="detail-empty">Select a candidate to see the full breakdown.</div>';
    metricsArea.innerHTML = '';
    progressList.innerHTML = '';
    progressDetailPanel.innerHTML = '<div class="detail-empty">Select a patient to see their full test breakdown.</div>';
    enrollmentSummary.innerHTML = '';
    enrollmentList.innerHTML = '';
    auditPanel.innerHTML = '<div class="detail-empty">Audit trail for this trial will appear here.</div>';
    selectedPatientId = null;
    progressLoadedFor = null;
    enrollmentLoadedFor = null;
    cachedCandidates = null;
    cachedCandidatesFor = null;
    tabRow.classList.remove('visible');
    switchTab('candidates');
    setStatus('Loading trial…');

    try {
      const res = await fetch(`/trials/${encodeURIComponent(nctId)}`);
      const data = await res.json();
      if (!res.ok) {
        setError(data.detail || 'No trial found for that ID.');
        loadBtn.disabled = false;
        return;
      }

      currentNctId = data.nct_id;
      const phase = Array.isArray(data.phase) ? data.phase.join(', ') : data.phase;
      trialInfo.innerHTML = `
        <span class="title">${esc(data.title || data.nct_id)}</span>
        <span class="meta">${esc(data.nct_id)}${phase ? ' · ' + esc(phase) : ''}${data.overall_status ? ' · ' + esc(data.overall_status) : ''}</span>
      `;
      tabRow.classList.add('visible');

      await loadCandidates(currentNctId);
    } catch (err) {
      setError('Could not reach the server. Try again.');
    } finally {
      loadBtn.disabled = false;
    }
  }

  function switchTab(tab) {
    tabCandidates.classList.toggle('active', tab === 'candidates');
    tabProgress.classList.toggle('active', tab === 'progress');
    tabEnrollment.classList.toggle('active', tab === 'enrollment');
    viewCandidates.classList.toggle('active', tab === 'candidates');
    viewProgress.classList.toggle('active', tab === 'progress');
    viewEnrollment.classList.toggle('active', tab === 'enrollment');
  }

  async function loadCandidates(nctId) {
    setStatus('Matching candidates against this trial’s criteria…');
    candidateList.innerHTML = '';
    funnelArea.innerHTML = '';

    try {
      const res = await fetch(`/trials/${encodeURIComponent(nctId)}/db-candidates?limit=${currentPatientCount}&max_evaluate=${currentPatientCount}`);
      const data = await res.json();
      if (!res.ok) {
        setError(data.detail || 'No parsed criteria for this trial yet.');
        return;
      }

      setStatus('');

      funnelArea.innerHTML = `
        <div class="funnel">
          <div class="funnel-figure">${data.evaluated_count}<span class="of"> / ${data.total_patients}</span></div>
          <div class="funnel-label">patients evaluated</div>
          <div class="funnel-sub">${data.coarse_filtered_count} matched the coarse filter · showing ${data.returned}</div>
        </div>
      `;

      if (data.candidates.length === 0) {
        candidateList.innerHTML = '<div class="detail-empty">No candidates matched.</div>';
        return;
      }

      candidateList.innerHTML = data.candidates.map(c => {
        const demo = [c.age !== null && c.age !== undefined ? c.age : null, c.sex].filter(Boolean).join(' · ');
        return `
          <button class="candidate" data-pid="${esc(c.patient_id)}">
            <div class="candidate-top">
              <span class="candidate-id mono">${esc(shortId(c.patient_id))}</span>
              <span class="badge ${badgeClass(c.overall)}">${esc(c.overall)}</span>
            </div>
            ${demo ? `<div class="candidate-demo">${esc(demo)}</div>` : ''}
            <div class="candidate-tally">${c.pass_count} pass · ${c.fail_count} fail · ${c.unknown_count} unknown</div>
          </button>
        `;
      }).join('');

      candidateList.querySelectorAll('.candidate').forEach(btn => {
        btn.addEventListener('click', () => selectCandidate(btn.dataset.pid));
      });
    } catch (err) {
      setError('Could not reach the server. Try again.');
    }
  }

  async function selectCandidate(patientId) {
    selectedPatientId = patientId;
    candidateList.querySelectorAll('.candidate').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.pid === patientId);
    });

    detailPanel.innerHTML = '<div class="skeleton">Loading breakdown…</div>';

    try {
      const res = await fetch(`/trials/${encodeURIComponent(currentNctId)}/match/${encodeURIComponent(patientId)}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        detailPanel.innerHTML = `<div class="detail-empty">${esc(data.detail || 'Could not load this candidate.')}</div>`;
        return;
      }

      const inclusions = data.results.filter(r => r.type === 'inclusion');
      const exclusions = data.results.filter(r => r.type === 'exclusion');

      const verifyButton = (labResultId, patientValue, panelId) => {
        if (labResultId === null || labResultId === undefined) return '';
        const expected = JSON.stringify(patientValue === undefined ? null : patientValue);
        return `<button class="verify-btn" data-lab-id="${esc(labResultId)}" data-expected='${esc(expected)}' data-panel="${panelId}">Verify source &rarr;</button>`;
      };

      const renderRuleBreakdown = (r) => {
        if (!r.rule_results || !r.rule_results.length) return '';
        const rows = r.rule_results.map((rr, i) => {
          const panelId = `verify-${esc(r.id)}-${i}`;
          const groupLabel = (rr.group !== null && rr.group !== undefined)
            ? `<span class="rule-group-label">Path ${rr.group + 1}</span>` : '';
          return `
            <div class="rule-row">
              <div class="rule-head">
                <span>${groupLabel}${esc(rr.field)} ${esc(rr.operator)} ${esc(rr.value)}
                  <span class="kv-value">(patient: ${esc(rr.patient_value)})</span></span>
                ${verifyButton(rr.source_lab_result_id, rr.patient_value, panelId)}
              </div>
              <div id="${panelId}"></div>
            </div>
          `;
        }).join('');
        return `<div class="rule-breakdown">${rows}</div>`;
      };

      const renderCriterion = (r) => {
        const topPanelId = `verify-${esc(r.id)}`;
        return `
        <div class="criterion">
          <div class="criterion-top">
            <div class="criterion-text">${esc(r.text)}</div>
            <span class="verdict-pill verdict-${esc(r.verdict)}">${esc(r.verdict)}</span>
          </div>
          <div class="criterion-meta">
            ${r.patient_value !== null && r.patient_value !== undefined ? `<span><span class="kv-label">value </span><span class="kv-value">${esc(Array.isArray(r.patient_value) ? r.patient_value.join(', ') : r.patient_value)}</span></span>` : ''}
            ${r.source_lab_result_id !== null && r.source_lab_result_id !== undefined ? `<span><span class="kv-label">source </span><span class="kv-value">lab_result #${esc(r.source_lab_result_id)}</span></span> ${verifyButton(r.source_lab_result_id, r.patient_value, topPanelId)}` : ''}
          </div>
          <div class="criterion-reason">${esc(r.reason)}</div>
          <div id="${topPanelId}"></div>
          ${renderRuleBreakdown(r)}
        </div>
      `;
      };

      detailPanel.innerHTML = `
        <div class="detail-header">
          <span class="id">${esc(shortId(patientId))}</span>
          <span class="demo">${esc(data.overall)}</span>
        </div>
        ${inclusions.length ? `<div class="eyebrow group-label">Inclusion</div>${inclusions.map(renderCriterion).join('')}` : ''}
        ${exclusions.length ? `<div class="eyebrow group-label">Exclusion</div>${exclusions.map(renderCriterion).join('')}` : ''}
      `;
    } catch (err) {
      detailPanel.innerHTML = '<div class="detail-empty">Could not reach the server. Try again.</div>';
    }
  }

  // Source data verification: fetches the real lab_results row a verdict
  // cited and confirms it against the value the verdict actually used --
  // delegated on detailPanel since criteria are re-rendered per candidate.
  detailPanel.addEventListener('click', async (e) => {
    const btn = e.target.closest('.verify-btn');
    if (!btn) return;

    const panel = document.getElementById(btn.dataset.panel);
    if (!panel) return;

    let expectedRaw = null;
    try { expectedRaw = JSON.parse(btn.dataset.expected); } catch (err) { /* leave null */ }
    const expectedValues = Array.isArray(expectedRaw) ? expectedRaw : [expectedRaw];

    btn.disabled = true;
    panel.innerHTML = '<div class="verify-panel">Loading source record…</div>';

    try {
      const res = await fetch(`/lab-results/${encodeURIComponent(btn.dataset.labId)}`);
      const data = await res.json();
      if (!res.ok) {
        panel.innerHTML = `<div class="verify-panel">${esc(data.detail || 'Could not load source record.')}</div>`;
        btn.disabled = false;
        return;
      }

      const actualNum = parseFloat(data.value);
      const comparable = expectedValues.filter(v => v !== null && v !== undefined && !isNaN(parseFloat(v)));
      const matches = comparable.some(v => Math.abs(parseFloat(v) - actualNum) < 1e-6);
      const hasRange = data.reference_min !== null && data.reference_min !== undefined
        && data.reference_max !== null && data.reference_max !== undefined;

      panel.innerHTML = `
        <div class="verify-panel">
          <div class="verify-row"><span class="k">test</span><span class="v">${esc(data.test_name)} (${esc(data.test_code)})</span></div>
          <div class="verify-row"><span class="k">value</span><span class="v${data.abnormal_flag ? ' abnormal' : ''}">${esc(data.value)}${data.unit ? ' ' + esc(data.unit) : ''}${data.abnormal_flag ? ' — abnormal' : ''}</span></div>
          ${hasRange ? `<div class="verify-row"><span class="k">reference range</span><span class="v">${esc(data.reference_min)} – ${esc(data.reference_max)}</span></div>` : ''}
          <div class="verify-row"><span class="k">test date</span><span class="v">${esc((data.test_date || '').replace('T', ' ').slice(0, 19)) || '—'}</span></div>
          <div class="verify-row"><span class="k">entered into system</span><span class="v">${esc((data.created_at || '').replace('T', ' ').slice(0, 19)) || '—'}</span></div>
          <div class="verify-row"><span class="k">lab report</span><span class="v">${esc(data.lab_report_id) || '—'}</span></div>
          ${comparable.length ? `<div class="verify-status ${matches ? 'ok' : 'mismatch'}">${matches ? '✓ Verified — matches the value this verdict used' : '⚠ Mismatch — source value differs from what the verdict used'}</div>` : ''}
        </div>
      `;
      btn.remove();
    } catch (err) {
      panel.innerHTML = '<div class="verify-panel">Could not reach the server. Try again.</div>';
      btn.disabled = false;
    }
  });

  function devClass(status) {
    return 'dev-' + status;
  }

  function fmtValue(v) {
    if (v === null || v === undefined) return '—';
    return typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(2)) : v;
  }

  function fmtDate(d) {
    if (!d) return null;
    return d.slice(0, 10);
  }

  function changeBarWidth(t) {
    if (t.deviation === null || t.deviation === undefined || !t.baseline_value) return 0;
    const pctChange = Math.abs(t.deviation / t.baseline_value) * 100;
    return Math.min(pctChange, 50) / 50 * 100; // visual scale caps at 50% change
  }

  function changeBarHtml(t) {
    return `<div class="change-bar-track"><div class="change-bar-fill ${devClass(t.status)}" style="width:${changeBarWidth(t)}%"></div></div>`;
  }

  function renderCohortChart(patients) {
    const byTest = {};
    patients.forEach(p => {
      p.tests.forEach(t => {
        if (!byTest[t.test_code]) {
          byTest[t.test_code] = { name: t.test_name || t.test_code, improved: 0, worsened: 0, indeterminate: 0, no_data: 0 };
        }
        if (byTest[t.test_code][t.status] !== undefined) byTest[t.test_code][t.status]++;
      });
    });

    const codes = Object.keys(byTest).sort();
    if (!codes.length) {
      return '<div class="detail-empty">No test data recorded for enrolled patients yet.</div>';
    }

    const rows = codes.map(code => {
      const c = byTest[code];
      const total = c.improved + c.worsened + c.indeterminate + c.no_data;
      const seg = (n) => total ? (n / total * 100) : 0;
      return `
        <div class="cohort-row">
          <div class="cohort-row-label">
            <span class="name">${esc(c.name)}</span>
            <span class="counts">${c.improved} improved · ${c.worsened} worsened · ${c.indeterminate + c.no_data} no signal</span>
          </div>
          <div class="cohort-track">
            <div class="cohort-segment seg-improved" style="width:${seg(c.improved)}%"></div>
            <div class="cohort-segment seg-worsened" style="width:${seg(c.worsened)}%"></div>
            <div class="cohort-segment seg-indeterminate" style="width:${seg(c.indeterminate)}%"></div>
            <div class="cohort-segment seg-no_data" style="width:${seg(c.no_data)}%"></div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="cohort-chart">
        <div class="cohort-title">Cohort trend by test — ${patients.length} enrolled patient${patients.length === 1 ? '' : 's'}</div>
        ${rows}
        <div class="cohort-legend">
          <span><span class="dot" style="background:var(--pass)"></span>Improved</span>
          <span><span class="dot" style="background:var(--fail)"></span>Worsened</span>
          <span><span class="dot" style="background:var(--unknown)"></span>Indeterminate</span>
          <span><span class="dot" style="background:var(--muted-2); opacity:0.5"></span>No follow-up data</span>
        </div>
      </div>
    `;
  }

  async function loadProgress(nctId) {
    metricsArea.innerHTML = '<div class="skeleton">Computing baseline-vs-latest progress…</div>';
    progressList.innerHTML = '';

    try {
      const res = await fetch(`/trials/${encodeURIComponent(nctId)}/progress`);
      const data = await res.json();
      if (!res.ok) {
        metricsArea.innerHTML = `<div class="detail-empty">${esc(data.detail || 'Could not load progress for this trial.')}</div>`;
        return;
      }

      progressLoadedFor = nctId;
      window.__progressData = data;

      const successRatePct = data.success_rate !== null && data.success_rate !== undefined
        ? Math.round(data.success_rate * 100)
        : null;
      const successPct = successRatePct !== null ? successRatePct + '%' : '—';
      const ringGradient = successRatePct !== null
        ? `conic-gradient(var(--pass) ${successRatePct * 3.6}deg, var(--line) 0)`
        : `conic-gradient(var(--line) 0deg, var(--line) 0)`;

      metricsArea.innerHTML = `
        <div class="metrics-top">
          <div class="progress-ring" style="background: ${ringGradient}">
            <div class="progress-ring-hole"><span class="progress-ring-pct">${successPct}</span></div>
          </div>
          <div class="metrics-side">
            <div class="metric">
              <div class="metric-figure">${data.enrolled}</div>
              <div class="metric-label">enrolled</div>
            </div>
            <div class="metric">
              <div class="metric-figure">${data.active}</div>
              <div class="metric-label">active</div>
            </div>
            <div class="metric">
              <div class="metric-figure">${data.dropouts}</div>
              <div class="metric-label">dropouts</div>
            </div>
          </div>
        </div>
        <div class="metric-sub" style="margin-bottom: 0.75rem;">${data.primary_test_code_used ? `success rate = share of enrolled patients improved on ${esc(data.primary_test_code_used)}` : 'no direction-defined test with enough data yet'}</div>
        <div class="disclaimer">
          This measures the treatment cohort's trajectory against its own baseline on
          ${data.primary_test_code_used ? esc(data.primary_test_code_used) : 'a tracked test'} — not a controlled
          efficacy result. There is no control arm here.
        </div>
      `;

      if (data.patients.length === 0) {
        progressList.innerHTML = '<div class="detail-empty">No patients enrolled in this trial yet.</div>';
        progressDetailPanel.innerHTML = '<div class="detail-empty">No patients enrolled in this trial yet.</div>';
        return;
      }

      progressDetailPanel.innerHTML = renderCohortChart(data.patients);

      progressList.innerHTML = data.patients.map(p => {
        const rows = p.tests.map(t => `
          <div class="test-readout">
            <span class="dev-dot ${devClass(t.status)}"></span>
            <span>${esc(t.test_code)}</span>
            <span class="readout-value">${fmtValue(t.baseline_value)} → ${fmtValue(t.latest_value)}</span>
            ${changeBarHtml(t)}
          </div>
        `).join('');
        return `
          <button class="patient-progress-row" data-pid="${esc(p.patient_id)}">
            <div class="ppr-top">
              <span class="ppr-id mono">${esc(shortId(p.patient_id))}</span>
              <span class="status-tag">${esc(p.status)}</span>
            </div>
            <div class="ppr-tests">${rows}</div>
          </button>
        `;
      }).join('');

      progressList.querySelectorAll('.patient-progress-row').forEach(btn => {
        btn.addEventListener('click', () => selectProgressPatient(btn.dataset.pid));
      });
    } catch (err) {
      metricsArea.innerHTML = '<div class="detail-empty">Could not reach the server. Try again.</div>';
    }
  }

  function selectProgressPatient(patientId) {
    progressList.querySelectorAll('.patient-progress-row').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.pid === patientId);
    });

    const data = window.__progressData;
    const patient = data && data.patients.find(p => p.patient_id === patientId);
    if (!patient) {
      progressDetailPanel.innerHTML = '<div class="detail-empty">Could not find this patient.</div>';
      return;
    }

    const renderTest = (t) => `
      <div class="test-detail">
        <div class="test-detail-top">
          <span class="test-name">${esc(t.test_name)} <span class="mono" style="color: var(--muted); font-weight: 400;">(${esc(t.test_code)})</span></span>
          <span class="dev-pill ${devClass(t.status)}"><span class="dev-dot ${devClass(t.status)}"></span>${esc(t.status.replace('_', ' '))}</span>
        </div>
        <div class="test-readout-line">
          ${fmtValue(t.baseline_value)}${t.unit ? ' ' + esc(t.unit) : ''} → ${fmtValue(t.latest_value)}${t.unit ? ' ' + esc(t.unit) : ''}
          ${t.deviation !== null && t.deviation !== undefined ? `<span style="color: var(--muted);"> (${t.deviation > 0 ? '+' : ''}${t.deviation})</span>` : ''}
        </div>
        <div class="change-bar-wrap" style="margin-top: 0.4rem;">${changeBarHtml(t)}</div>
        <div class="test-citations">
          <span>baseline ${fmtDate(t.baseline_date) || '—'}${t.baseline_lab_result_id ? ` · lab_result #${t.baseline_lab_result_id}` : ''}</span>
          <span>latest ${fmtDate(t.latest_date) || '—'}${t.latest_lab_result_id ? ` · lab_result #${t.latest_lab_result_id}` : ''}</span>
        </div>
      </div>
    `;

    progressDetailPanel.innerHTML = `
      <div class="detail-header">
        <span class="id">${esc(shortId(patientId))}</span>
        <span class="demo">${esc(patient.status)} · baseline ${fmtDate(patient.baseline_date) || '—'}</span>
      </div>
      ${patient.tests.map(renderTest).join('')}
    `;
  }

  function statusPillClass(status) {
    return 'st-' + status;
  }

  function renderEnrollmentActions(patientId, status) {
    const buttons = [];
    if (status === 'not_invited') {
      buttons.push(`<button class="er-btn" data-action="invite" data-pid="${esc(patientId)}">Invite</button>`);
    }
    if (status === 'invited') {
      buttons.push(`<a class="er-link" href="/consent.html?patient=${encodeURIComponent(patientId)}&trial=${encodeURIComponent(currentNctId)}" target="_blank" rel="noopener">Open consent screen ↗</a>`);
    }
    if (status === 'consented') {
      buttons.push(`<button class="er-btn" data-action="enroll" data-pid="${esc(patientId)}">Enroll</button>`);
    }
    if (['invited', 'accepted', 'consented', 'enrolled'].includes(status)) {
      buttons.push(`<button class="er-btn danger" data-action="withdraw" data-pid="${esc(patientId)}">Withdraw</button>`);
    }
    return buttons.join('');
  }

  async function loadEnrollment(nctId, quiet) {
    const haveCache = cachedCandidatesFor === nctId && cachedCandidates !== null;

    if (!quiet && !haveCache) {
      enrollmentSummary.innerHTML = '<div class="skeleton">Loading candidates and enrollment status…</div>';
      enrollmentList.innerHTML = '';
    }

    try {
      let candidates;
      if (haveCache) {
        candidates = cachedCandidates;
      } else {
        const candRes = await fetch(`/trials/${encodeURIComponent(nctId)}/db-candidates?limit=${currentPatientCount}&max_evaluate=${currentPatientCount}`);
        const candData = await candRes.json();
        if (!candRes.ok) {
          enrollmentSummary.innerHTML = `<div class="detail-empty">${esc(candData.detail || 'No parsed criteria for this trial yet.')}</div>`;
          return;
        }
        candidates = candData.candidates;
        cachedCandidates = candidates;
        cachedCandidatesFor = nctId;
      }

      const enrollRes = await fetch(`/trials/${encodeURIComponent(nctId)}/enrollment`);
      const enrollData = await enrollRes.json();

      enrollmentLoadedFor = nctId;
      const statusByPatient = {};
      if (enrollRes.ok) {
        enrollData.forEach(e => { statusByPatient[e.patient_id] = e.status; });
      }

      const counts = {};
      candidates.forEach(c => {
        const st = statusByPatient[c.patient_id] || 'not_invited';
        counts[st] = (counts[st] || 0) + 1;
      });

      enrollmentSummary.innerHTML = `
        <div class="funnel">
          <div class="funnel-figure">${candidates.length}<span class="of"> candidates</span></div>
          <div class="funnel-label">from the ranked list</div>
          <div class="funnel-sub">${Object.entries(counts).map(([k, v]) => `${v} ${k.replace('_', ' ')}`).join(' · ')}</div>
        </div>
      `;

      enrollmentList.innerHTML = candidates.map(c => {
        const status = statusByPatient[c.patient_id] || 'not_invited';
        return `
          <div class="enrollment-row">
            <div class="er-top">
              <span class="er-id mono">${esc(shortId(c.patient_id))}</span>
              <span class="badge ${badgeClass(c.overall)}">${esc(c.overall)}</span>
            </div>
            <div class="candidate-demo">
              <span class="status-pill ${statusPillClass(status)}">${esc(status.replace('_', ' '))}</span>
            </div>
            <div class="er-actions">${renderEnrollmentActions(c.patient_id, status)}</div>
          </div>
        `;
      }).join('');

      enrollmentList.querySelectorAll('.er-btn').forEach(btn => {
        btn.addEventListener('click', () => performAction(btn.dataset.pid, btn.dataset.action));
      });

      await loadAuditTrail(nctId);
    } catch (err) {
      enrollmentSummary.innerHTML = '<div class="detail-empty">Could not reach the server. Try again.</div>';
    }
  }

  async function loadAuditTrail(nctId) {
    auditPanel.innerHTML = '<div class="skeleton">Loading audit trail…</div>';
    try {
      const res = await fetch(`/trials/${encodeURIComponent(nctId)}/audit?limit=100`);
      const data = await res.json();
      if (!res.ok) {
        auditPanel.innerHTML = `<div class="detail-empty">${esc(data.detail || 'Could not load audit trail.')}</div>`;
        return;
      }
      if (data.length === 0) {
        auditPanel.innerHTML = '<div class="detail-empty">No audit events for this trial yet.</div>';
        return;
      }
      const rows = data.map(row => {
        const detail = row.detail ? `${esc(row.detail.from_status || '—')} → ${esc(row.detail.to_status || '—')}` : '—';
        return `
          <tr>
            <td>${esc((row.created_at || '').replace('T', ' ').slice(0, 19))}</td>
            <td class="actor-${esc(row.actor)}">${esc(row.actor)}</td>
            <td>${esc(row.action)}</td>
            <td>${esc((row.entity_id || '').split(':')[0].slice(0, 8))}</td>
            <td>${detail}</td>
          </tr>
        `;
      }).join('');
      auditPanel.innerHTML = `
        <div class="eyebrow group-label">Audit trail</div>
        <div style="overflow-x: auto;">
          <table class="audit-table">
            <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Patient</th><th>Transition</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    } catch (err) {
      auditPanel.innerHTML = '<div class="detail-empty">Could not reach the server. Try again.</div>';
    }
  }

  async function performAction(patientId, action) {
    try {
      const res = await fetch(`/trials/${encodeURIComponent(currentNctId)}/patients/${encodeURIComponent(patientId)}/${action}`, { method: 'POST' });
      const data = await res.json();
      if (!res.ok) {
        setError(data.detail || 'Action failed.');
        return;
      }
      setStatus('');
      await loadEnrollment(currentNctId, true);
    } catch (err) {
      setError('Could not reach the server. Try again.');
    }
  }

  tabCandidates.addEventListener('click', () => switchTab('candidates'));
  tabProgress.addEventListener('click', () => {
    switchTab('progress');
    if (currentNctId && progressLoadedFor !== currentNctId) {
      loadProgress(currentNctId);
    }
  });
  tabEnrollment.addEventListener('click', () => {
    switchTab('enrollment');
    if (currentNctId && enrollmentLoadedFor !== currentNctId) {
      loadEnrollment(currentNctId, false);
    }
  });

  loadBtn.addEventListener('click', loadTrial);
  nctInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadTrial();
  });
</script>

</body>
</html>
